<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P6 Gantt View - Schedule Analyzer</title>
    
    <!-- DHTMLX Gantt (Free Open-Source Version) -->
    <link rel="stylesheet" href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css">
    <script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* ═══════════════════════════════════════════
           P6-STYLE GANTT CHART
           ═══════════════════════════════════════════ */
        
        body { overflow: hidden; }
        
        .gantt-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .gantt-toolbar {
            background: white;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .toolbar-group {
            display: flex;
            gap: 0.25rem;
            padding-right: 0.75rem;
            border-right: 1px solid #e2e8f0;
        }
        
        .toolbar-group:last-child {
            border-right: none;
        }
        
        .tb-btn {
            padding: 0.4rem 0.7rem;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .tb-btn:hover {
            background: #f1f5f9;
        }
        
        .tb-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        
        .gantt-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        
        #ganttChart {
            width: 100%;
            height: 100%;
        }
        
        /* Column selector modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal h3 {
            margin-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        
        .column-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .column-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .column-item:hover {
            background: #f1f5f9;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
        }
        
        /* DHTMLX Gantt Customization - P6 Style */
        .gantt_task_line.gantt-critical {
            background-color: #dc2626;
            border-color: #991b1b;
        }
        .gantt_task_line.gantt-critical .gantt_task_progress {
            background-color: #7f1d1d;
        }
        
        .gantt_task_line.gantt-completed {
            background-color: #10b981;
            border-color: #059669;
        }
        .gantt_task_line.gantt-completed .gantt_task_progress {
            background-color: #065f46;
        }
        
        .gantt_task_line.gantt-normal {
            background-color: #3b82f6;
            border-color: #1e40af;
        }
        .gantt_task_line.gantt-normal .gantt_task_progress {
            background-color: #1e3a8a;
        }
        
        .gantt_task_line.gantt-loe {
            background-color: #94a3b8;
            border-color: #64748b;
            opacity: 0.7;
        }
        
        /* Milestone styling */
        .gantt_task_line.gantt-milestone-critical .gantt_milestone_content {
            background: #dc2626;
        }
        .gantt_task_line.gantt-milestone-normal .gantt_milestone_content {
            background: #f59e0b;
        }
        
        /* Grid header styling */
        .gantt_grid_head_cell {
            font-weight: 600 !important;
            background: #f8fafc !important;
            color: #1e293b !important;
        }
        
        .gantt_row.gantt_selected {
            background-color: #dbeafe !important;
        }
        
        /* Critical row highlight */
        .gantt_row.critical-row {
            background-color: #fef2f2;
        }
        
        /* Loading */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="gantt-page">
        
        <!-- Header -->
        <header class="app-header" style="padding: 0.75rem 1.5rem;">
            <div class="header-content">
                <div class="logo-section">
                    <span class="logo-icon">📊</span>
                    <div>
                        <h1 style="font-size: 1.2rem;">P6 Gantt View</h1>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="/" class="btn btn-secondary">← Dashboard</a>
                    <a href="/comparison" class="btn btn-secondary">🔄 Compare</a>
                    <a href="/evm" class="btn btn-secondary">📊 EVM</a>
                </div>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="gantt-toolbar">
            <div class="toolbar-group">
                <button class="tb-btn" onclick="showColumnSelector()">
                    📋 Columns
                </button>
                <button class="tb-btn" onclick="expandAll()">➕ Expand</button>
                <button class="tb-btn" onclick="collapseAll()">➖ Collapse</button>
            </div>
            
            <div class="toolbar-group">
                <span style="font-size: 0.85rem; color: #64748b;">Zoom:</span>
                <button class="tb-btn" onclick="setZoom('hour')">Hour</button>
                <button class="tb-btn" onclick="setZoom('day')">Day</button>
                <button class="tb-btn active" onclick="setZoom('week')">Week</button>
                <button class="tb-btn" onclick="setZoom('month')">Month</button>
                <button class="tb-btn" onclick="setZoom('quarter')">Quarter</button>
                <button class="tb-btn" onclick="setZoom('year')">Year</button>
            </div>
            
            <div class="toolbar-group">
                <button class="tb-btn" onclick="toggleBaseline()">
                    <span id="baselineBtn">📊 Baseline</span>
                </button>
                <button class="tb-btn" onclick="toggleCritical()">
                    <span id="criticalBtn">🔴 Critical Only</span>
                </button>
            </div>
            
            <div class="toolbar-group">
                <label style="font-size: 0.85rem;">Max Activities:</label>
                <select onchange="reloadData(this.value)" style="padding: 0.4rem; border-radius: 4px;">
                    <option value="100">100</option>
                    <option value="250">250</option>
                    <option value="500" selected>500</option>
                    <option value="1000">1000</option>
                    <option value="2000">2000</option>
                </select>
            </div>
            
            <div class="toolbar-group" style="margin-left: auto;">
                <span id="statsDisplay" style="font-size: 0.85rem; color: #64748b;">
                    Loading...
                </span>
            </div>
        </div>

        <!-- Gantt Container -->
        <div class="gantt-container">
            <div id="loadingOverlay" class="loading-overlay">
                <div style="text-align: center;">
                    <div class="spinner"></div>
                    <p style="margin-top: 1rem;">Loading Gantt data...</p>
                </div>
            </div>
            <div id="ganttChart"></div>
        </div>
    </div>

    <!-- Column Selector Modal -->
    <div class="modal-overlay" id="columnModal">
        <div class="modal">
            <h3>📋 Select Columns to Display</h3>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;">
                Choose which columns appear in the Gantt grid.
            </p>
            
            <div class="column-list" id="columnList">
                <!-- Populated by JS -->
            </div>
            
            <div class="modal-actions">
                <button class="tb-btn" onclick="selectAllColumns(true)">Select All</button>
                <button class="tb-btn" onclick="selectAllColumns(false)">Clear All</button>
                <button class="tb-btn" onclick="resetColumns()">Reset Default</button>
                <button class="tb-btn active" onclick="applyColumns()">Apply</button>
                <button class="tb-btn" onclick="closeColumnSelector()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='gantt.js') }}"></script>
</body>
</html>
